<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Girlfriend?</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url('image.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      overflow-x: hidden;
      color: white;
    }

    .container {
      backdrop-filter: blur(6px);
      background: rgba(0, 0, 0, 0.4);
      padding: 50px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    p {
      font-size: 1.5rem;
      max-width: 700px;
      margin: 0 auto 30px;
      animation: fadeIn 3s ease-in-out;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    button {
      font-size: 1.5rem;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: #ff4d88;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #e6005c;
    }

    .heart {
      position: fixed;
      top: -20px;
      color: red;
      animation: fall 5s linear infinite;
      font-size: 24px;
      z-index: 1000;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10%);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Will You Be My Girlfriend?</h1>
    <p>
      From the first moment we met, something clicked. Your smile, your laugh, your presence—
      they’ve made my days brighter. I created this page just for you. Will you make me the happiest person today?
    </p>
    <div class="buttons">
      <button onclick="startHeartRain()">Yes 💖</button>
      <button onclick="startHeartRain()">No 😢</button>
    </div>
  </div>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    function startHeartRain() {
      for (let i = 0; i < 40; i++) {
        setTimeout(createHeart, i * 150);
      }
    }
  </script>
</body>
</html>
